<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6558e8">
  <title>Offline — Developer MASTERMIND</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
      background: #f6f7fb;
      color: #202238;
      font-family: system-ui, sans-serif;
    }

    main {
      width: 100%;
      max-width: 430px;
      padding: 32px;
      background: #fff;
      border: 1px solid #e9eaf2;
      border-radius: 20px;
      text-align: center;
    }

    .logo {
      width: 56px;
      height: 56px;
      display: grid;
      place-items: center;
      margin: 0 auto 22px;
      border-radius: 17px;
      background: #6558e8;
      color: #fff;
      font-size: 27px;
      font-weight: 800;
    }

    h1 { font-size: 24px; }

    p {
      color: #777c91;
      line-height: 1.8;
      font-size: 14px;
    }

    a {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 18px;
      border-radius: 10px;
      background: #6558e8;
      color: #fff;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo">M</div>
    <h1>You're offline</h1>
    <p>
      If you have opened Developer MASTERMIND before,
      try opening the installed app again. Your saved notes
      are stored separately on this device.
    </p>
    <a href="./">Try again</a>
  </main>
</body>
</html>
